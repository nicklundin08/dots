get:
  summary: Retrieve a list of tasks
  operationId: getTasks
  description: Returns a JSON array containing all tasks.
  responses:
    '200':
      description: A successful response.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../components/schemas.yaml#/Task'
    '500':
      description: Internal server error.
post:
  summary: Create a new task
  operationId: createTask
  description: Adds a new task to the manager.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas.yaml#/NewTask'
  responses:
    '201':
      description: Task created successfully.
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Task'
    '400':
      description: Invalid input provided.
